name: Build to Docker Hub & Deploy to Google Cloud Run

on:
  push:
    branches:
      - main

env:
  SERVICE_NAME: "luminair"
  REGION: "asia-southeast2"
  DOCKERHUB_REPO: "ahmadluay/luminair-vibecoding" # UPDATE THIS with your Docker Hub username and repository name

jobs:
  deploy:
    name: Publish to Docker Hub & Deploy
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository code
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Log in to Docker Hub
      # Requires DOCKERHUB_USERNAME and DOCKERHUB_TOKEN as GitHub Secrets
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 3. Build, tag, and push Docker image to Docker Hub
      - name: Build and Push Docker Container
        run: |
          IMAGE_TAG="${{ env.DOCKERHUB_REPO }}:${{ github.sha }}"
          LATEST_TAG="${{ env.DOCKERHUB_REPO }}:latest"
          
          echo "Building image: $IMAGE_TAG"
          docker build \
            --tag "$IMAGE_TAG" \
            --tag "$LATEST_TAG" \
            .
            
          echo "Pushing image to Docker Hub..."
          docker push "$IMAGE_TAG"
          docker push "$LATEST_TAG"

      # 4. Authenticate to Google Cloud (needed to command Cloud Run deployment)
      # Requires GCP_SA_KEY (Service Account JSON Key) as a GitHub Secret
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      # 5. Setup Google Cloud SDK CLI
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      # 6. Deploy to Google Cloud Run pulling directly from Docker Hub
      # Cloud Run pulls public Docker Hub images using standard 'docker.io/' resolution
      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE_NAME }}
          region: ${{ env.REGION }}
          image: docker.io/${{ env.DOCKERHUB_REPO }}:${{ github.sha }}
          
          # Inject production secret credentials into Cloud Run container environment
          env_vars: |
            VITE_API_KEY=${{ secrets.VITE_API_KEY }}
            VITE_GEMINI_API_KEY=${{ secrets.VITE_GEMINI_API_KEY }}